name: Update ICT data

# Runs by itself on the 20th of every month. Ookla usually publishes the new
# Speedtest Global Index month around the 15th, so by the 20th it is there.
# One run does everything: fetch the new data, check it, rebuild the page's
# JSON files, refit the forecasts, commit, and ask GitHub Pages to republish.
# It can also be started by hand from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: '0 6 20 * *'   # 20th of each month, 06:00 UTC = 10:00 in Baku
  workflow_dispatch:

concurrency:
  group: update-ict-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # commit the new data
      pages: write      # request a Pages rebuild
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: data-pipeline/ict/requirements.txt

      - name: Install dependencies
        run: pip install -r data-pipeline/ict/requirements.txt

      # --- 1. Fetch -----------------------------------------------------------
      # A source that fails is reported as a warning; the others still update,
      # and the stored history of the failed one is kept as it was.
      - name: Speedtest Global Index (CIS countries, monthly)
        run: python data-pipeline/ict/update_global_index.py || echo "::warning::Some Global Index countries could not be refreshed"

      - name: Ookla Open Data (Azerbaijan's cities and districts, new quarters only)
        run: python data-pipeline/ict/build_azerbaijan_regions.py || echo "::warning::Open Data could not be refreshed"

      - name: APNIC IPv6
        run: python data-pipeline/ict/update_apnic_ipv6.py || echo "::warning::Some IPv6 series could not be refreshed"

      - name: ITU / World Bank via Our World in Data
        run: python data-pipeline/ict/update_owid.py || echo "::warning::Some OWID series could not be refreshed"

      # --- 2. Check: stop here, committing nothing, if any history was lost ---
      - name: Verify
        run: python data-pipeline/ict/verify.py

      # --- 3. Build the page data and the forecasts ---------------------------
      - name: Export JSON for the page
        run: python data-pipeline/ict/export_json.py

      - name: Refit the forecasts
        run: python data-pipeline/ict/forecast.py || echo "::warning::Some forecasts could not be fitted; the others were written"

      # --- 4. Publish ---------------------------------------------------------
      - name: Commit and push
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/ict/archive assets/data/ict
          if git diff --cached --quiet; then
            echo "No new data this month."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update ICT data and forecasts ($(date -u +%Y-%m-%d))"
            # the ORCID job may have committed meanwhile
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the website
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::notice::Pages will rebuild from the push itself"

      - name: Summary
        if: always()
        run: |
          {
            echo "### ICT data update"
            echo "- Latest Global Index month: $(tail -n +2 data-pipeline/ict/archive/global_index.csv | cut -d, -f4 | sort | tail -1)"
            echo "- New data committed: ${{ steps.commit.outputs.changed || 'no' }}"
          } >> "$GITHUB_STEP_SUMMARY"
